[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haqvaani"
version = "0.1.0"
description = "Citizen-side RBI Statutory Refund Advocate — Great Indian AI Internship Challenge"
requires-python = ">=3.11"
# Runtime deps live in requirements.txt (free/open-source only).
dependencies = []

[tool.setuptools.packages.find]
include = ["haqvaani*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
